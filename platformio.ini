[platformio]
src_dir = main
default_envs = esp32dev

[env:esp32dev]
; Same platform version used by the documented board tests; avoid toolchain drift.
platform = espressif32@6.12.0
board = esp32dev
framework = espidf
board_build.partitions = partitions_two_ota_large.csv

monitor_speed = 115200
; Lower than the board default after a serial stream failure during flash.
upload_speed = 460800

; ESP-IDF discovers components/ and owns source/include dependencies via CMake.
; Do not also register them as PlatformIO LDF libraries or add global -I paths.
build_flags =
    -Wl,--wrap=printf

; Explicit hardware timeout test only. The runner restores esp32dev afterwards.
[env:esp32dev_wifi_timeout]
extends = env:esp32dev
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DFSW_TEST_WIFI_TIMEOUT=1

; Explicit NVS failure test: intercept init/erase; never damage the real NVS.
[env:esp32dev_nvs_failure]
extends = env:esp32dev
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DFSW_TEST_NVS_INIT_FAILURE=1
    -Wl,--wrap=nvs_flash_init
    -Wl,--wrap=nvs_flash_erase

; Explicit network stack failure test; SDK init is intercepted, not damaged.
[env:esp32dev_netif_failure]
extends = env:esp32dev
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DFSW_TEST_NETIF_INIT_FAILURE=1
    -Wl,--wrap=esp_netif_init
    -Wl,--wrap=esp_netif_deinit
    -Wl,--wrap=YAMCS_MarkNetworkStackReady
    -Wl,--wrap=esp_event_loop_create_default

; Explicit event-loop failure test: real network stack stays initialized.
[env:esp32dev_event_loop_failure]
extends = env:esp32dev
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DFSW_TEST_EVENT_LOOP_FAILURE=1
    -Wl,--wrap=esp_event_loop_create_default
    -Wl,--wrap=esp_event_loop_delete_default
    -Wl,--wrap=esp_netif_create_default_wifi_sta
    -Wl,--wrap=esp_wifi_init

; Combined lifecycle test: real late connection, 3 disconnects, timed soak.
[env:esp32dev_wifi_lifecycle]
extends = env:esp32dev
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DFSW_TEST_WIFI_LIFECYCLE=1

; Explicit allocation-return test. Does not exhaust or corrupt real memory.
[env:esp32dev_wifi_interface_failure]
extends = env:esp32dev
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DFSW_TEST_WIFI_INTERFACE_FAILURE=1
    -Wl,--wrap=esp_netif_new
    -Wl,--wrap=esp_wifi_init

; Explicit mission heartbeat loss. Normal firmware never drops pets.
[env:esp32dev_wdt_task_loss]
extends = env:esp32dev
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DFSW_TEST_WDT_TASK_LOSS=1

; Explicit supervisor self-suspend; one injection until SDK TASK_WDT reboot.
; The runner MUST restore esp32dev after this destructive RAM-loss test.
[env:esp32dev_wdt_supervisor_stall]
extends = env:esp32dev
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DFSW_TEST_WDT_SUPERVISOR_STALL=1

; Explicit CPU0 idle starvation. IRQs stay enabled; real TWDT must reset.
[env:esp32dev_wdt_idle_starvation]
extends = env:esp32dev
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DFSW_TEST_WDT_IDLE_STARVATION=1

; Explicit CPU0 IRQ mask. Real 300 ms IWDT must panic/reset; no fake restart.
[env:esp32dev_wdt_interrupt_mask]
extends = env:esp32dev
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DFSW_TEST_WDT_INTERRUPT_MASK=1

; Same isolated faults on CPU1; SDK policy and normal firmware are unchanged.
[env:esp32dev_wdt_idle_starvation_cpu1]
extends = env:esp32dev_wdt_idle_starvation
build_flags =
    ${env:esp32dev_wdt_idle_starvation.build_flags}
    -DFSW_TEST_WDT_CORE=1

[env:esp32dev_wdt_interrupt_mask_cpu1]
extends = env:esp32dev_wdt_interrupt_mask
build_flags =
    ${env:esp32dev_wdt_interrupt_mask.build_flags}
    -DFSW_TEST_WDT_CORE=1

; Both cores: gated priority-24 workers, IRQs enabled, real TWDT recovery.
[env:esp32dev_wdt_global_starvation]
extends = env:esp32dev
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DFSW_TEST_WDT_GLOBAL_STARVATION=1

; Bounded drop/resume/re-drop. Real owner recovery only; never clears faults.
; Requires explicit ground mode commands and normal restore after the test.
[env:esp32dev_wdt_task_recovery]
extends = env:esp32dev
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DFSW_TEST_WDT_TASK_RECOVERY=1

; Required-startup return-code tests, not real heap exhaustion. Panic reset
; suppresses injection on the second boot; always restore esp32dev afterwards.
[env:esp32dev_startup_hk_failure]
extends = env:esp32dev
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DFSW_TEST_STARTUP_FAILURE=1
    -Wl,--wrap=HK_Init

[env:esp32dev_startup_task_early]
extends = env:esp32dev_startup_hk_failure
build_flags =
    ${env:esp32dev.build_flags}
    -DFSW_TEST_STARTUP_FAILURE=2
    -Wl,--wrap=HK_Init
    -Wl,--wrap=xTaskCreatePinnedToCore

; Explicit sticky BOOT_LOOP test: three real caller aborts, then normal startup.
; No NVS erase/corruption. Requires fresh archive protection and separate approval.
[env:esp32dev_recovery_boot_loop]
extends = env:esp32dev_startup_hk_failure
build_flags =
    ${env:esp32dev_startup_hk_failure.build_flags}
    -DFSW_TEST_RECOVERY_BOOT_LOOP=1

[env:esp32dev_startup_task_late]
extends = env:esp32dev_startup_hk_failure
build_flags =
    ${env:esp32dev.build_flags}
    -DFSW_TEST_STARTUP_FAILURE=3
    -Wl,--wrap=HK_Init
    -Wl,--wrap=xTaskCreatePinnedToCore

; Controlled simulated EPS input, real services/RTOS + three explicit ground TCs.
; Preserve RAM before upload/reset; runner must restore normal esp32dev.
[env:esp32dev_mission_lifecycle]
extends = env:esp32dev
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DFSW_TEST_MISSION_LIFECYCLE=1
    -Wl,--wrap=vSolarHarvest_Task
    -Wl,--wrap=vCommandInjectionTask
    -Wl,--wrap=FDIR_ProcessCommand
